<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق TAKST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .app-icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h1 {
            color: #333;
            margin: 0 0 10px;
            font-size: 28px;
        }
        .version {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .info-row {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .info-item {
            text-align: center;
        }
        .info-item .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        .info-item .value {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 16px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .download-btn:active {
            transform: translateY(0);
        }
        .updates-btn {
            display: inline-block;
            background: #f0f0f5;
            color: #555;
            text-decoration: none;
            padding: 14px 50px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #e0e0e5;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .updates-btn:hover {
            background: #e8e8f0;
            transform: translateY(-2px);
        }
        .updates-btn:active {
            transform: translateY(0);
        }
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }
        .note a {
            color: #667eea;
            text-decoration: none;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            padding-top: 40px;
            animation: fadeInOverlay 0.3s ease;
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        @keyframes slideUp {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .modal-header h2 {
            color: #333;
            font-size: 22px;
            margin: 0;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #333;
        }
        .update-block {
            text-align: right;
            margin-bottom: 24px;
        }
        .update-title {
            font-size: 15px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .copy-btn {
            display: block;
            width: 100%;
            padding: 12px 30px;
            background: linear-gradient(135deg,#667eea,#764ba2);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .copy-btn:hover { transform: translateY(-2px); }
        .copy-btn:active { transform: translateY(0); }
        .copy-btn.done {
            background: linear-gradient(135deg,#00aa44,#00cc55);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://i.postimg.cc/L4172JJR/IMG-20261008-204740-452.jpg" alt="TAKST App Icon" class="app-icon">
        <h1>TAKST</h1>
        <div class="version">الإصدار 1.0</div>
        
        <div class="info-row">
            <div class="info-item">
                <div class="label">الحجم</div>
                <div class="value">31.8 MB</div>
            </div>
            <div class="info-item">
                <div class="label">النظام</div>
                <div class="value">أندرويد</div>
            </div>
            <div class="info-item">
                <div class="label">النوع</div>
                <div class="value">APK</div>
            </div>
        </div>

        <a href="https://loadly.io/UWvgVGui" class="download-btn" target="_blank" rel="noopener" download>
            ⬇ تحميل التطبيق
        </a>

        <button onclick="openUpdates()" class="updates-btn">
            🔄 البحث في التحديثات
        </button>

        <div class="note">
            سيتم توجيهك إلى صفحة التحميل. يبدأ التحميل تلقائيًا.<br>
            رابط بديل: <a href="https://loadly.io/UWvgVGui" target="_blank">loadly.io/UWvgVGui</a>
        </div>
    </div>

    <!-- Updates Modal -->
    <div id="updatesModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>التحديثات</h2>
                <button class="close-btn" onclick="closeUpdates()">&times;</button>
            </div>

            <div class="update-block">
                <div class="update-title">تحديث 1.0</div>
                <button class="copy-btn" onclick="copyUpdateScript(this)">📋 نسخ سكريبت التحديث</button>
            </div>

        </div>
    </div>

    <script>
        function openUpdates() {
            document.getElementById('updatesModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeUpdates() {
            document.getElementById('updatesModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.getElementById('updatesModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeUpdates();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeUpdates();
            }
        });

        function copyUpdateScript(btn) {
            var scriptText = `var updLink = document.createElement('a');
updLink.href = 'https://mohzayd14-sudo.github.io/takst-download/';
updLink.target = '_blank';
updLink.innerHTML = '⬇️ تحميل التحديثات';
updLink.style.cssText = 'display:block;width:100%;padding:10px;margin-bottom:10px;background:linear-gradient(90deg,#00aa44,#00ff66);color:#fff;text-decoration:none;border-radius:8px;font-weight:bold;font-size:14px;text-align:center;box-shadow:0 0 15px rgba(0,255,102,0.4)';
var updContent = document.querySelector('#upd .mb') || document.querySelector('#updContent');
if(updContent){
  var firstChild = updContent.firstChild;
  if(firstChild){
    updContent.insertBefore(updLink, firstChild);
  } else {
    updContent.appendChild(updLink);
  }
}`;
            var original = btn.innerHTML;
            function done() {
                btn.innerHTML = '✅ تم النسخ';
                btn.classList.add('done');
                setTimeout(function() {
                    btn.innerHTML = original;
                    btn.classList.remove('done');
                }, 1500);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(scriptText).then(done).catch(function() {
                    fallbackCopy(scriptText); done();
                });
            } else {
                fallbackCopy(scriptText); done();
            }
        }
        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
        }
    </script>
</body>
</html>
